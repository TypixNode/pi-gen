# TypixDeck: phoc (Phosh compositor) output configuration.
# phosh-session prefers /etc/phosh/phoc.ini over /usr/share/phosh/phoc.ini.
#
# The built-in 3.2" 1024x768 DPI panel is ~400 ppi. phoc's automatic scale
# comes out at 1.25 (too small to touch); 2.0 does not leave enough logical
# height (512x384) for Phosh's lock screen keypad. 1.5 (683x512) is the
# compromise verified on the device.
[core]
xwayland=false

[output:DPI-1]
scale = 1.5
