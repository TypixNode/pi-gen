name: Build image

# The build itself, called by the workflows that offer it: build-typixdeck.yml
# and build.yml. Not dispatchable on its own.
#
# The runner is arm64, so the build is native rather than going through qemu.

on:
  workflow_call:
    inputs:
      variant:
        description: the stock lite, desktop and full builds, or any custom
          variant when the config input names its config file
        type: string
        required: true
      config:
        description: pi-gen config file for a custom variant (e.g. config-typixdeck);
          blank keeps the built-in variant handling
        type: string
        default: ''
      ref:
        description: Branch, tag or SHA to build; blank uses the calling ref
        type: string
        default: ''
      move_pointer:
        description: Point the published OS list at this build
        type: boolean
        default: false
      pointer_tag:
        description: Release tag that carries the published OS list
        type: string
        default: typixdeck-latest
      os_list_name:
        description: Imager entry name for this build; blank generates os_list.json
          only for the slim-desktop variant, as before
        type: string
        default: ''
      os_list_description:
        description: Imager entry second line, used with os_list_name
        type: string
        default: ''
      os_list_devices:
        description: Device tags for the Imager entry, comma separated
        type: string
        default: pi4-64bit,pi3-64bit
      os_list_capabilities:
        description: Imager capabilities for the entry, comma separated
        type: string
        default: ''
      os_list_icon:
        description: Icon URL for the Imager entry; blank uses the script default
        type: string
        default: ''
      beta:
        description: Mark the Imager entry as a pre-release; its name gets a UTC
          timestamp and a (Beta) suffix, its description the commit and run number
        type: boolean
        default: false
      session:
        type: string
        default: wayland
      browser:
        type: string
        default: chromium
      extra_packages:
        type: string
        default: ''
      keep_toolchain:
        type: boolean
        default: true
      locale:
        type: string
        default: en_GB.UTF-8
      timezone:
        type: string
        default: Europe/London
      compression:
        type: string
        default: xz

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      SLIM_DESKTOP_SESSION: ${{ inputs.session }}
      SLIM_BROWSER: ${{ inputs.browser }}
      SLIM_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      SLIM_KEEP_TOOLCHAIN: ${{ inputs.keep_toolchain && '1' || '0' }}
      SLIM_RPI_CONNECT: '1'
      LOCALE_DEFAULT: ${{ inputs.locale }}
      TIMEZONE_DEFAULT: ${{ inputs.timezone }}
      DEPLOY_COMPRESSION: ${{ inputs.compression }}
      BUILD_VARIANT: ${{ inputs.variant }}
      BUILD_CONFIG: ${{ inputs.config }}
      POINTER_TAG: ${{ inputs.pointer_tag }}
      OS_LIST_NAME: ${{ inputs.os_list_name }}
      OS_LIST_DESCRIPTION: ${{ inputs.os_list_description }}
      OS_LIST_DEVICES: ${{ inputs.os_list_devices }}
      OS_LIST_CAPABILITIES: ${{ inputs.os_list_capabilities }}
      OS_LIST_ICON: ${{ inputs.os_list_icon }}
      OS_LIST_BETA: ${{ inputs.beta && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Show the runner
        run: |
          uname -a
          nproc
          free -h
          df -h
          dpkg --print-architecture

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          df -h

      # Package downloads are one of the biggest costs of a pi-gen run, so an
      # apt-cacher-ng proxy on the runner is persisted between builds. The
      # WORK_DIR rootfs is deliberately NOT cached: restoring a stale rootfs
      # makes export-image partition for the old size, which a later
      # dist-upgrade then overflows, and a single rootfs copy would eat most
      # of the repository's 10GB cache quota by itself.
      #
      # The key ends in the run id so every run uploads its (grown) cache;
      # restore-keys fall back to the newest cache of this variant, then of
      # any variant on this architecture.
      - name: Restore the apt package cache
        uses: actions/cache@v4
        with:
          path: apt-cache
          key: apt-cacher-ng-${{ runner.arch }}-${{ inputs.variant }}-${{ github.run_id }}
          restore-keys: |
            apt-cacher-ng-${{ runner.arch }}-${{ inputs.variant }}-
            apt-cacher-ng-${{ runner.arch }}-

      - name: Start apt-cacher-ng on port 9999
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-cacher-ng
          sudo systemctl stop apt-cacher-ng
          # The daemon's cache directory is owned by its own user, which
          # actions/cache cannot read or write, so the cache lives in the
          # workspace between runs and is moved into place for the build
          # (and back again in the last step of the job).
          if [ -d apt-cache ]; then
            sudo rm -rf /var/cache/apt-cacher-ng
            sudo mv apt-cache /var/cache/apt-cacher-ng
            sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng
          fi
          # The daemon reads every *.conf in the directory and the last value
          # of a key wins, so an override file beats editing acng.conf in
          # place (whose Port line may be commented out, which is why a sed
          # on it silently left the daemon on 3142). PassThroughPattern
          # tunnels https mirrors instead of refusing them; only http is
          # cached, which covers the Raspberry Pi and Debian archives.
          printf 'Port: 9999\nPassThroughPattern: .*\n' |
            sudo tee /etc/apt-cacher-ng/zz-ci.conf >/dev/null
          sudo systemctl start apt-cacher-ng
          for i in $(seq 1 15); do
            curl --silent --fail http://127.0.0.1:9999/acng-report.html >/dev/null && break
            if [ "$i" = 15 ]; then
              echo "apt-cacher-ng did not come up on port 9999" >&2
              systemctl status apt-cacher-ng --no-pager || true
              sudo journalctl -u apt-cacher-ng --no-pager | tail -30 || true
              exit 1
            fi
            sleep 1
          done
          # build.sh exports this to debootstrap (http_proxy) and writes it
          # into the chroot's apt config; export-image removes it from the
          # final image. The build is a native chroot sharing the runner's
          # network stack, so 127.0.0.1 reaches the proxy from inside it.
          echo "APT_PROXY=http://127.0.0.1:9999" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync \
            xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod

      - name: Choose a work directory
        run: |
          # The stage rootfs copies and the image together need well over 10GB.
          # Prefer the runner's ephemeral disk when it is the larger one.
          dir="$PWD/work"
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt 20000000 ]; then
            sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/pi-gen-work
            dir=/mnt/pi-gen-work
          fi
          echo "WORK_DIR=$dir" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          # Every variant is arranged to export exactly one image, so that the
          # later steps have one thing to verify and publish.
          case "$BUILD_VARIANT" in
          lite)
            touch stage3/SKIP stage4/SKIP stage5/SKIP
            touch stage4/SKIP_IMAGES stage5/SKIP_IMAGES
            sudo -E ./build.sh
            ;;
          desktop)
            touch stage5/SKIP
            touch stage2/SKIP_IMAGES stage5/SKIP_IMAGES
            sudo -E ./build.sh
            ;;
          full)
            touch stage2/SKIP_IMAGES stage4/SKIP_IMAGES
            sudo -E ./build.sh
            ;;
          *)
            if [ -z "$BUILD_CONFIG" ]; then
              echo "unknown variant: $BUILD_VARIANT (custom variants need the config input)" >&2
              exit 1
            fi
            if [ ! -f "$BUILD_CONFIG" ]; then
              echo "$BUILD_CONFIG is not in this ref; pick another variant" >&2
              exit 1
            fi
            # A custom config's own final stage carries the EXPORT_IMAGE, so
            # the stock stages must not export a second image.
            touch stage2/SKIP_IMAGES stage4/SKIP_IMAGES stage5/SKIP_IMAGES
            sudo -E ./build.sh -c "$BUILD_CONFIG"
            ;;
          esac

      - name: Verify the image
        env:
          # A 4GB eMMC module reports a little under 4 x 10^9 bytes, and Imager
          # refuses anything larger than the target.
          TARGET_STORAGE_BYTES: '3900000000'
          EXPECTED_SESSION: ${{ inputs.session == 'x11' && 'rpd-x' || 'rpd-labwc' }}
        run: |
          IMG="$(ls "$WORK_DIR"/export-image/*.img)"
          if [ "$BUILD_VARIANT" = slim-desktop ]; then
            sudo -E REPORT_FILE=image-report.env ./scripts/verify-slim-image "$IMG"
            # shellcheck disable=SC1091
            . ./image-report.env
            {
              echo '### Slim desktop image'
              echo
              printf 'Uncompressed image: **%s** (%s bytes)\n\n' \
                "$(numfmt --to=si --suffix=B "$IMAGE_SIZE")" "$IMAGE_SIZE"
              printf 'Root filesystem: %s used, %s free inside the image. It grows to fill the storage on first boot, which on a 4GB eMMC module leaves at least %s free.\n\n' \
                "$(numfmt --to=si --suffix=B "$ROOT_USED")" \
                "$(numfmt --to=si --suffix=B "$ROOT_AVAIL")" \
                "$(numfmt --to=si --suffix=B "$((TARGET_STORAGE_BYTES - BOOT_PART_SIZE - 8388608 - ROOT_FOOTPRINT))")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # The stock variants make no promise about fitting small storage, so
            # there is nothing to assert; report what came out.
            sudo parted -s "$IMG" unit B print
            SIZE="$(stat -c %s "$IMG")"
            printf '### %s image\n\nUncompressed image: **%s** (%s bytes)\n\n' \
              "$BUILD_VARIANT" "$(numfmt --to=si --suffix=B "$SIZE")" "$SIZE" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble the release
        run: |
          sudo chown -R "$(id -u):$(id -g)" deploy
          # Every build gets its own release, and its image asset is never
          # replaced. Imager verifies the image against the hash it read from the
          # OS list, so an image URL whose contents change breaks every OS list
          # that has already been fetched and cached - the pointer release below
          # is what moves instead.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            BUILD_TAG="$GITHUB_REF_NAME"
            if [ -n "$BUILD_CONFIG" ]; then
              # One tag can build several variants of a matrix; give each its
              # own release so their sha256sums and OS lists do not collide.
              BUILD_TAG="$GITHUB_REF_NAME-$BUILD_VARIANT"
            fi
          else
            BUILD_TAG="$BUILD_VARIANT-build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

          ARCHIVE="$(ls deploy/image_*.img.xz deploy/image_*.img.gz deploy/image_*.zip \
            deploy/*.img 2>/dev/null | head -1)"
          # Drop pi-gen's "image_" prefix and build date, leaving a name that is
          # the same in every build release and so predictable in an OS list.
          BASE="$(basename "$ARCHIVE")"
          BASE="${BASE#image_}"
          ASSET="$(echo "$BASE" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')"
          STEM="${ASSET%%.img*}"
          STEM="${STEM%.zip}"

          mkdir -p release
          cp "$ARCHIVE" "release/$ASSET"
          for f in deploy/*.bmap; do
            if [ -e "$f" ]; then cp "$f" "release/$STEM.bmap"; fi
          done
          for f in deploy/*.info; do
            if [ -e "$f" ]; then cp "$f" "release/$STEM.info"; fi
          done

          if [ "$BUILD_VARIANT" = slim-desktop ]; then
            ./scripts/make-os-list-json \
              --image "$WORK_DIR"/export-image/*.img \
              --archive "release/$ASSET" \
              --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BUILD_TAG/$ASSET" \
              --release-date "$(date -u +%Y-%m-%d)" \
              --devices pi4-64bit,pi3-64bit \
              --capabilities "$([ "$SLIM_RPI_CONNECT" = 1 ] && echo rpi_connect || echo '')" \
              --website "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --output release/os_list.json
          elif [ -n "$OS_LIST_NAME" ]; then
            EXTRA_ARGS=()
            if [ -n "$OS_LIST_ICON" ]; then
              EXTRA_ARGS+=(--icon "$OS_LIST_ICON")
            fi
            if [ "$OS_LIST_BETA" = 1 ]; then
              EXTRA_ARGS+=(--beta \
                --build-timestamp "$(date -u +%Y%m%d-%H%M%S)" \
                --commit "${GITHUB_SHA:0:7}" \
                --run-number "$GITHUB_RUN_NUMBER")
            fi
            ./scripts/make-os-list-json \
              --image "$WORK_DIR"/export-image/*.img \
              --archive "release/$ASSET" \
              --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BUILD_TAG/$ASSET" \
              --name "$OS_LIST_NAME" \
              --description "$OS_LIST_DESCRIPTION" \
              --release-date "$(date -u +%Y-%m-%d)" \
              --devices "$OS_LIST_DEVICES" \
              --capabilities "$OS_LIST_CAPABILITIES" \
              --website "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "${EXTRA_ARGS[@]}" \
              --output release/os_list.json
          fi

          ( cd release && sha256sum ./* > sha256sums.txt )
          ls -l release
          if [ -f release/os_list.json ]; then cat release/os_list.json; fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # A push keeps the published OS list current; a manual build is left for
          # the "Append to OS list" workflow to add deliberately.
          MOVE_POINTER: ${{ inputs.move_pointer }}
        run: |
          BUILD_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BUILD_TAG"
          POINTER_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$POINTER_TAG"
          {
            if [ "$BUILD_VARIANT" = slim-desktop ]; then
              echo 'arm64 Raspberry Pi OS with the desktop, trimmed to fit 4GB storage'
              echo '(Compute Module 3 and up), built from `config-slim-desktop`.'
            elif [ -n "$OS_LIST_NAME" ]; then
              echo "$OS_LIST_DESCRIPTION"
              echo
              echo "Built from \`$BUILD_CONFIG\` at \`${GITHUB_SHA:0:7}\` (\`${GITHUB_REF_NAME}\`)."
            else
              echo "Stock pi-gen \`$BUILD_VARIANT\` image, built from \`${GITHUB_REF_NAME}\`."
            fi
            echo
            echo '## Raspberry Pi Imager'
            echo
            if [ -f release/os_list.json ]; then
              echo 'To pin this build, whose image and checksums will never change:'
              echo
              echo '```'
              echo "rpi-imager --repo $BUILD_URL/os_list.json"
              echo '```'
              echo
              if [ "$MOVE_POINTER" = true ]; then
                echo 'To follow the newest build:'
                echo
                echo '```'
                echo "rpi-imager --repo $POINTER_URL/os_list.json"
                echo '```'
                echo
              fi
              echo 'Hostname, username and password, SSH keys, Wi-Fi credentials,'
              echo 'locale and Raspberry Pi Connect are applied through cloud-init,'
              echo 'the same mechanism the stock Trixie images use'
              echo '(`init_format: cloudinit-rpi`).'
            else
              echo 'Run the "Append to OS list" workflow with this tag to add the'
              echo 'image to an OS list Imager can be pointed at.'
            fi
            echo
            echo '## Files'
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for f in release/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" \
                "$(numfmt --to=iec --suffix=B "$(stat -c %s "$f")")"
            done
          } > release-notes.md

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            PRERELEASE=
          else
            PRERELEASE=--prerelease
          fi
          if ! gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            gh release create "$BUILD_TAG" $PRERELEASE --target "$GITHUB_SHA" \
              --title "Raspberry Pi OS $BUILD_VARIANT $BUILD_TAG" \
              --notes-file release-notes.md
          fi
          # --clobber only ever replaces assets of a re-run of this same commit.
          gh release upload "$BUILD_TAG" release/* --clobber

          # The pointer release carries nothing but the OS list, so a copy of it
          # that Imager or a CDN has cached still names an image that exists and
          # still matches the hashes it was published with.
          if [ "$MOVE_POINTER" = true ]; then
            {
              echo 'OS list for Raspberry Pi Imager, pointing at the newest build.'
              echo
              echo '```'
              echo "rpi-imager --repo $POINTER_URL/os_list.json"
              echo '```'
              echo
              echo "Currently: [$BUILD_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$BUILD_TAG)"
            } > pointer-notes.md
            if gh release view "$POINTER_TAG" >/dev/null 2>&1; then
              gh release edit "$POINTER_TAG" --notes-file pointer-notes.md
            else
              gh release create "$POINTER_TAG" --prerelease --target "$GITHUB_SHA" \
                --title "Raspberry Pi OS slim desktop (OS list for the newest build)" \
                --notes-file pointer-notes.md
            fi
            gh release upload "$POINTER_TAG" release/os_list.json --clobber
            # Nothing else belongs here: an image served from a URL that later
            # changes is what broke hash verification in the first place.
            gh release view "$POINTER_TAG" --json assets \
              --jq '.assets[].name | select(. != "os_list.json")' |
            while read -r extra; do
              [ -n "$extra" ] || continue
              echo "removing $extra from $POINTER_TAG"
              gh release delete-asset "$POINTER_TAG" "$extra" --yes
            done
          fi

          {
            echo
            echo "Build release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$BUILD_TAG"
            if [ -f release/os_list.json ]; then
              echo
              echo 'Add to Raspberry Pi Imager:'
              echo
              echo '```'
              if [ "$MOVE_POINTER" = true ]; then
                echo "rpi-imager --repo $POINTER_URL/os_list.json"
              else
                echo "rpi-imager --repo $BUILD_URL/os_list.json"
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune superseded build releases
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep a few builds so that an OS list fetched a while ago still
          # resolves; beyond that a stale list gets an honest 404 rather than
          # silently pointing at different bytes.
          gh release list --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"$BUILD_VARIANT-build-\"))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName" |
          while read -r old; do
            [ -n "$old" ] || continue
            echo "deleting superseded $old"
            gh release delete "$old" --yes --cleanup-tag
          done

      # Runs even after a failed build: whatever apt-cacher-ng did download is
      # still worth keeping. actions/cache uploads the directory in its post
      # step, which runs after this one.
      - name: Hand the apt cache back to actions/cache
        if: always()
        run: |
          sudo systemctl stop apt-cacher-ng || true
          # If the job died before the proxy was even set up, leave whatever
          # the cache restored in place rather than uploading an empty one.
          if [ -d /var/cache/apt-cacher-ng ]; then
            rm -rf apt-cache
            sudo mv /var/cache/apt-cacher-ng apt-cache
            sudo chown -R "$(id -u):$(id -g)" apt-cache
          fi
          mkdir -p apt-cache
          du -sh apt-cache || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant }}-metadata
          path: |
            release/os_list.json
            release/sha256sums.txt
            release/*.bmap
            release/*.info
          if-no-files-found: error
