name: Build slim desktop image

# The desktop image config-slim-desktop trims to fit 4GB storage, such as a
# Compute Module 3's eMMC.
#
# A push builds it and merges the result into the shared OS list on the
# typixdeck-latest pointer release, next to the TypixDeck images, so one
# custom repository URL offers everything. A manual run publishes its build
# release and leaves the OS list alone; add it to the list with the "Append
# to OS list" workflow when you want Imager to offer it.
# (The old slim-desktop-latest pointer is no longer moved; it keeps serving
# the last list published before the switch.)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (blank = the one selected above)
        type: string
        default: ''
      session:
        description: Desktop session
        type: choice
        options: [wayland, x11, both]
        default: wayland
      browser:
        description: Browser (chromium ~360MB, firefox ~280MB, none)
        type: choice
        options: [chromium, firefox, none]
        default: chromium
      extra_packages:
        description: Extra packages, space separated (e.g. "fonts-noto-cjk vlc")
        type: string
        default: ''
      keep_toolchain:
        description: Keep build-essential, gdb and the kernel headers (~250MB)
        type: boolean
        default: true
      locale:
        description: Default locale, also the translations kept in the image
        type: string
        default: en_GB.UTF-8
      timezone:
        description: Default timezone
        type: string
        default: Europe/London
      compression:
        description: Image compression
        type: choice
        options: [xz, zip, gz, none]
        default: xz
  push:
    tags:
      - 'slim-desktop-v*'
    branches:
      - 'cursor/**'
      - typixdeck
    paths:
      - 'slim-desktop-stage/**'
      - 'config-slim-desktop'
      - 'export-image/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build-image.yml'
      - '.github/workflows/build-slim-desktop.yml'

# A build takes minutes; only the newest commit on a branch is worth one.
concurrency:
  group: slim-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build-image.yml
    with:
      variant: slim-desktop
      ref: ${{ inputs.ref || '' }}
      # The os-list job below merges the entry into the shared typixdeck-latest
      # pointer; move_pointer would clobber that list with just this build.
      move_pointer: false
      session: ${{ inputs.session || 'wayland' }}
      browser: ${{ inputs.browser || 'chromium' }}
      extra_packages: ${{ inputs.extra_packages || '' }}
      keep_toolchain: ${{ github.event_name != 'workflow_dispatch' || inputs.keep_toolchain }}
      locale: ${{ inputs.locale || 'en_GB.UTF-8' }}
      timezone: ${{ inputs.timezone || 'Europe/London' }}
      compression: ${{ inputs.compression || 'xz' }}

  os-list:
    needs: build
    # Only an automatic build keeps the published OS list current, as before.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Shared with build-typixdeck.yml and append-os-list.yml runs that target
    # the same pointer, so two download-merge-upload sequences never interleave.
    concurrency:
      group: os-list-typixdeck-latest
    env:
      GH_TOKEN: ${{ github.token }}
      POINTER_TAG: typixdeck-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: slim-desktop-metadata
          path: artifacts/slim-desktop-metadata

      - name: Merge the entry into the shared OS list
        run: |
          mkdir -p work
          if gh release download "$POINTER_TAG" --pattern os_list.json --dir work; then
            echo "merging into the existing list"
          else
            echo "no existing list at $POINTER_TAG, starting one"
          fi

          src=artifacts/slim-desktop-metadata/os_list.json
          if [ ! -f "$src" ]; then
            echo "the build produced no OS list entry; nothing to publish"
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # The slim entry keeps a stable name, so merging replaces the
          # top-level entry in place; no Beta subitems folding needed.
          ./scripts/make-os-list-json \
            --merge-from "$src" \
            --merge-into work/os_list.json \
            --output work/os_list.json
          cat work/os_list.json

      - name: Publish the OS list
        if: env.SKIP_PUBLISH != '1'
        run: |
          POINTER_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$POINTER_TAG"
          if gh release view "$POINTER_TAG" >/dev/null 2>&1; then
            :
          else
            {
              echo 'OS list for Raspberry Pi Imager: TypixDeck and slim desktop images.'
              echo
              echo '```'
              echo "rpi-imager --repo $POINTER_URL/os_list.json"
              echo '```'
            } > notes.md
            gh release create "$POINTER_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "TypixDeck OS images (OS list for Raspberry Pi Imager)" \
              --notes-file notes.md
          fi
          gh release upload "$POINTER_TAG" work/os_list.json --clobber
