name: Build slim desktop image

# Builds the arm64 Raspberry Pi OS desktop image that config-slim-desktop trims
# to fit 4GB storage. The default runner is arm64, so the build is native and
# does not go through qemu.

on:
  workflow_dispatch:
    inputs:
      session:
        description: Desktop session
        type: choice
        options: [wayland, x11, both]
        default: wayland
      browser:
        description: Browser (chromium ~360MB, firefox ~280MB, none)
        type: choice
        options: [chromium, firefox, none]
        default: chromium
      extra_packages:
        description: Extra packages, space separated (e.g. "fonts-noto-cjk vlc")
        type: string
        default: ''
      keep_toolchain:
        description: Keep build-essential, gdb and the kernel headers (~250MB)
        type: boolean
        default: true
      locale:
        description: Default locale, also the translations kept in the image
        type: string
        default: en_GB.UTF-8
      timezone:
        description: Default timezone
        type: string
        default: Europe/London
      compression:
        description: Image compression
        type: choice
        options: [xz, zip, gz, none]
        default: xz
  push:
    tags:
      - 'slim-desktop-v*'
    branches:
      - 'cursor/**'
    paths:
      - 'stage-slim-desktop/**'
      - 'config-slim-desktop'
      - 'export-image/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build-slim-desktop.yml'

# A build takes tens of minutes; only the newest commit on a branch is worth one.
concurrency:
  group: slim-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      SLIM_DESKTOP_SESSION: ${{ inputs.session || 'wayland' }}
      SLIM_BROWSER: ${{ inputs.browser || 'chromium' }}
      SLIM_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      SLIM_KEEP_TOOLCHAIN: ${{ (github.event_name != 'workflow_dispatch' || inputs.keep_toolchain) && '1' || '0' }}
      LOCALE_DEFAULT: ${{ inputs.locale || 'en_GB.UTF-8' }}
      TIMEZONE_DEFAULT: ${{ inputs.timezone || 'Europe/London' }}
      DEPLOY_COMPRESSION: ${{ inputs.compression || 'xz' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the runner
        run: |
          uname -a
          nproc
          free -h
          df -h
          dpkg --print-architecture

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync \
            xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod

      - name: Choose a work directory
        run: |
          # The stage rootfs copies and the image together need well over 10GB.
          # Prefer the runner's ephemeral disk when it is the larger one.
          dir="$PWD/work"
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt 20000000 ]; then
            sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/pi-gen-work
            dir=/mnt/pi-gen-work
          fi
          echo "WORK_DIR=$dir" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          # Only the desktop image is wanted, not the Lite one stage2 exports.
          touch stage2/SKIP_IMAGES
          sudo -E ./build.sh -c config-slim-desktop

      - name: Verify the image
        env:
          # A 4GB eMMC module reports a little under 4 x 10^9 bytes, and
          # rpi-imager refuses anything larger than the target.
          TARGET_STORAGE_BYTES: '3900000000'
          EXPECTED_SESSION: ${{ inputs.session == 'x11' && 'rpd-x' || 'rpd-labwc' }}
        run: |
          IMG="$(ls "$WORK_DIR"/export-image/*.img)"
          SIZE="$(stat -c %s "$IMG")"
          sudo parted -s "$IMG" unit B print
          LOOP="$(sudo losetup --show --find --partscan "$IMG")"
          sudo partprobe "$LOOP" || true
          sudo mkdir -p /tmp/img/boot /tmp/img/root
          sudo mount -o ro "${LOOP}p1" /tmp/img/boot
          sudo mount -o ro "${LOOP}p2" /tmp/img/root
          df -h /tmp/img/boot /tmp/img/root

          AVAIL="$(df -B1 --output=avail /tmp/img/root | tail -1)"
          USED="$(df -B1 --output=used /tmp/img/root | tail -1)"
          KERNELS="$(sudo ls /tmp/img/root/usr/lib/modules | wc -l)"
          SESSION="$(sudo sed -n 's/^user-session=//p' /tmp/img/root/etc/lightdm/lightdm.conf)"

          problems=0
          check() {
            if [ "$2" = 0 ]; then
              echo "FAIL: $1"
              problems=$((problems + 1))
            else
              echo "ok: $1"
            fi
          }
          check "image is $SIZE bytes, target holds $TARGET_STORAGE_BYTES" \
            "$([ "$SIZE" -le "$TARGET_STORAGE_BYTES" ] && echo 1 || echo 0)"
          check "root filesystem has $AVAIL bytes free for export-image to work in" \
            "$([ "$AVAIL" -ge 33554432 ] && echo 1 || echo 0)"
          check "exactly one kernel flavour installed (found $KERNELS)" \
            "$([ "$KERNELS" -eq 1 ] && echo 1 || echo 0)"
          check "lightdm session is $EXPECTED_SESSION (found ${SESSION:-none})" \
            "$([ "$SESSION" = "$EXPECTED_SESSION" ] && echo 1 || echo 0)"
          check "boot partition carries a kernel and an initramfs" \
            "$(sudo test -e /tmp/img/boot/kernel8.img && sudo test -e /tmp/img/boot/initramfs8 && echo 1 || echo 0)"
          if [ "$SLIM_KEEP_TOOLCHAIN" = '1' ]; then
            KVER="$(sudo ls /tmp/img/root/usr/lib/modules | head -1)"
            check "kernel headers are usable for out-of-tree modules" \
              "$(sudo test -e "/tmp/img/root/usr/lib/modules/$KVER/build/Makefile" && echo 1 || echo 0)"
            check "a compiler is installed" \
              "$(sudo test -x /tmp/img/root/usr/bin/gcc && echo 1 || echo 0)"
          fi

          {
            echo '### Slim desktop image'
            echo
            printf 'Uncompressed image: **%s** (%s bytes)\n\n' \
              "$(numfmt --to=si --suffix=B "$SIZE")" "$SIZE"
            printf 'Root filesystem: %s used, %s free inside the image. It grows to fill the storage on first boot, which on a 4GB eMMC module leaves about %s free.\n\n' \
              "$(numfmt --to=si --suffix=B "$USED")" \
              "$(numfmt --to=si --suffix=B "$AVAIL")" \
              "$(numfmt --to=si --suffix=B "$((TARGET_STORAGE_BYTES - 276824064 - USED))")"
          } >> "$GITHUB_STEP_SUMMARY"

          sudo umount /tmp/img/boot /tmp/img/root
          sudo losetup -d "$LOOP"
          exit "$problems"

      - name: List the artifacts
        run: |
          sudo chown -R "$(id -u):$(id -g)" deploy
          {
            echo '| File | Size |'
            echo '| --- | --- |'
            for f in deploy/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" \
                "$(numfmt --to=iec --suffix=B "$(stat -c %s "$f")")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l deploy

      - uses: actions/upload-artifact@v4
        with:
          name: raspios-slim-desktop-arm64
          path: |
            deploy/*.img*
            deploy/*.zip
            deploy/*.bmap
            deploy/*.info
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/slim-desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Raspberry Pi OS slim desktop ${GITHUB_REF_NAME}" \
            --notes "arm64 desktop image trimmed to fit 4GB storage, built from \`config-slim-desktop\`." \
            deploy/*
