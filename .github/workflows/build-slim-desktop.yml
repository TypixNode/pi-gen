name: Build slim desktop image

# Builds the arm64 Raspberry Pi OS desktop image that config-slim-desktop trims
# to fit 4GB storage. The default runner is arm64, so the build is native and
# does not go through qemu.

on:
  workflow_dispatch:
    inputs:
      session:
        description: Desktop session
        type: choice
        options: [wayland, x11, both]
        default: wayland
      browser:
        description: Browser (chromium ~360MB, firefox ~280MB, none)
        type: choice
        options: [chromium, firefox, none]
        default: chromium
      extra_packages:
        description: Extra packages, space separated (e.g. "fonts-noto-cjk vlc")
        type: string
        default: ''
      keep_toolchain:
        description: Keep build-essential, gdb and the kernel headers (~250MB)
        type: boolean
        default: true
      locale:
        description: Default locale, also the translations kept in the image
        type: string
        default: en_GB.UTF-8
      timezone:
        description: Default timezone
        type: string
        default: Europe/London
      compression:
        description: Image compression
        type: choice
        options: [xz, zip, gz, none]
        default: xz
  push:
    tags:
      - 'slim-desktop-v*'
    branches:
      - 'cursor/**'
    paths:
      - 'stage-slim-desktop/**'
      - 'config-slim-desktop'
      - 'export-image/**'
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/build-slim-desktop.yml'

# A build takes tens of minutes; only the newest commit on a branch is worth one.
concurrency:
  group: slim-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show the runner
        run: |
          uname -a
          nproc
          free -h
          df -h
          dpkg --print-architecture

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync \
            xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod

      - name: Build image
        run: |
          # The largest disk on a GitHub runner is the ephemeral one; the stage
          # rootfs copies and the image together need well over 10GB.
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt 20000000 ]; then
            sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/pi-gen-work
            export WORK_DIR=/mnt/pi-gen-work
          fi
          # Only the desktop image is wanted, not the Lite one stage2 exports.
          touch stage2/SKIP_IMAGES
          sudo -E ./build.sh -c config-slim-desktop
        env:
          SLIM_DESKTOP_SESSION: ${{ inputs.session || 'wayland' }}
          SLIM_BROWSER: ${{ inputs.browser || 'chromium' }}
          SLIM_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          SLIM_KEEP_TOOLCHAIN: ${{ (github.event_name != 'workflow_dispatch' || inputs.keep_toolchain) && '1' || '0' }}
          LOCALE_DEFAULT: ${{ inputs.locale || 'en_GB.UTF-8' }}
          TIMEZONE_DEFAULT: ${{ inputs.timezone || 'Europe/London' }}
          DEPLOY_COMPRESSION: ${{ inputs.compression || 'xz' }}

      - name: Report image size
        run: |
          sudo chown -R "$(id -u):$(id -g)" deploy
          # The uncompressed size is what has to fit the storage, and it is what
          # rpi-imager checks the target against.
          written=0
          for f in deploy/*.img.xz; do
            [ -e "$f" ] || continue
            written=$(xz --robot --list "$f" | awk '$1=="totals" {print $5}')
          done
          for f in deploy/*.img; do
            [ -e "$f" ] && written=$(stat -c %s "$f")
          done
          {
            echo '### Slim desktop image'
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for f in deploy/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(numfmt --to=iec --suffix=B "$(stat -c %s "$f")")"
            done
            echo
            if [ "$written" -gt 0 ]; then
              printf 'Uncompressed image: **%s** (%s bytes)\n\n' \
                "$(numfmt --to=si --suffix=B "$written")" "$written"
              # 4GB eMMC modules report a little under 4 x 10^9 bytes.
              if [ "$written" -le 3900000000 ]; then
                echo 'Fits a 4GB eMMC module.'
              else
                echo ':warning: Too large for a 4GB eMMC module.'
              fi
              echo
              echo 'The root filesystem grows to fill the storage on first boot.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l deploy

      - uses: actions/upload-artifact@v4
        with:
          name: raspios-slim-desktop-arm64
          path: |
            deploy/*.img*
            deploy/*.zip
            deploy/*.bmap
            deploy/*.info
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/slim-desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Raspberry Pi OS slim desktop ${GITHUB_REF_NAME}" \
            --notes "arm64 desktop image trimmed to fit 4GB storage, built from \`config-slim-desktop\`." \
            deploy/*
